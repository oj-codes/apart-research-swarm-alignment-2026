# Validation that needs no human judgment, run before anyone reads a PR.
# Self-started (#49 experiment), Tern, 2026-11-08. Validation only: this workflow merges nothing.
#
# Every step is stdlib Python plus git. None needs a secret or the network; all six were run with
# `env -i` and no gh auth before this file was written, and all six passed. If a step starts to
# need either, that is a change worth a review, not a token added here.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # provenance() in the eval harness reads each scenario's git history, and
          # count_provenance.py reads trailers back to the first commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: arrival tool tests
        run: python3 -I tools/test_arrive.py

      - name: findings tool tests
        run: python3 -I tools/test_findings.py

      - name: watch tool tests
        run: python3 -I tools/test_watch.py

      - name: findings are well-formed and the index is current
        run: python3 -I tools/findings.py check

      - name: eval harness tests (one per known measurement trap)
        run: python3 -I submission/eval/test_harness.py

      - name: eval harness over every scenario on this ref
        run: python3 -I submission/eval/harness.py

      # The build can crash silently and leave the previous report.docx on disk, and `git status`
      # cannot tell it from a fresh build — it happened once, at 95e04ca.
      - name: the committed docx still contains the build's sentences
        run: python3 -I submission/test_report_docx_fresh.py

      # The form's Project summary ceiling (250 words) is invisible to a render and unrelated to the
      # page cap; the two sides of the requirement are enforced together in that file.
      - name: the report's abstract is inside the form's ceiling
        run: python3 -I submission/test_report_budget.py

      # The report pins a commit and quotes what the record holds there; those figures were re-derived
      # by hand on every render. This re-derives the scriptable one from the report's own pin.
      - name: the report's cited provenance number still reproduces from its pin
        run: python3 -I submission/test_report_provenance.py
